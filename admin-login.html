<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | SmartCart AI</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body.login-page{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#eef2ff,#f8fafc)}
    .login-card{width:min(100%,420px);background:#fff;padding:34px;border-radius:20px;box-shadow:0 18px 55px rgba(15,23,42,.12)}
    .login-brand{text-align:center;font-size:25px;font-weight:800;margin-bottom:8px;color:#172554}
    .login-sub{text-align:center;color:#64748b;margin-bottom:26px}
    .login-card label{display:block;font-weight:600;margin:14px 0 7px;color:#334155}
    .login-card input{width:100%;padding:13px 14px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;box-sizing:border-box}
    .login-card button{width:100%;padding:13px;margin-top:22px;border:0;border-radius:10px;background:#1d4ed8;color:#fff;font-weight:700;font-size:16px;cursor:pointer}
    .login-error{color:#b91c1c;margin-top:14px;min-height:22px;font-size:14px}
    .login-note{font-size:12px;color:#64748b;line-height:1.5;margin-top:20px}
    .back-home{display:block;text-align:center;margin-top:18px;color:#1d4ed8;text-decoration:none}
  </style>
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-brand">🛒 SmartCart AI</div>
    <p class="login-sub">Admin Dashboard Sign In</p>
    <form id="admin-login-form">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required placeholder="Enter admin username">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Enter password">
      <button type="submit">Login to Dashboard</button>
      <p id="login-error" class="login-error" role="alert"></p>
    </form>
    <p class="login-note">College project demo only: this front-end login is not secure for private or real business data because its credentials can be discovered in the website code.</p>
    <a class="back-home" href="index.html">← Back to SmartCart Home</a>
  </main>
  <script>
    document.getElementById('admin-login-form').addEventListener('submit', function(event) {
      event.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (username === 'Admin' && password === 'SmartCart@2026') {
        sessionStorage.setItem('smartcartDemoAdminLoggedIn', 'true');
        window.location.href = 'admin.html';
      } else {
        document.getElementById('login-error').textContent = 'Incorrect username or password. Please try again.';
      }
    });
  </script>
</body>
</html>
