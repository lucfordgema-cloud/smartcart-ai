<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCart AI - Admin Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">🛒 SmartCart <span>AI</span></div>
        <div class="nav-links">
            <a href="index.html">🏠 Home</a>
            <a href="index.html#college-project">Project</a>
        </div>
    </header>

    <main class="admin-login-page">
        <div class="login-card">
            <div class="login-icon">🔐</div>
            <h1>Admin Login</h1>
            <p>Enter the administrator password to access the SmartCart dashboard.</p>

            <form onsubmit="event.preventDefault(); adminLogin();">
                <input
                    type="password"
                    id="admin-password"
                    placeholder="Enter admin password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" class="login-submit">
                    Login to Dashboard
                </button>
            </form>

            <p id="login-message" class="login-message" aria-live="polite"></p>
            <p class="demo-password-note"><strong>College demo password:</strong> <code>SCdemo2026!</code><br><small>Demo-only client-side check; not secure authentication.</small></p>

            <a href="index.html" class="back-home">← Back to SmartCart</a>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
